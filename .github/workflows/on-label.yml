name: On Label Add

on:
  pull_request:
    types: [labeled]

jobs:
  notify-on-label:
    # 1. Filter: Only run if the specific label "ready-for-stg" was added.
    if: github.event.label.name == 'ready-for-stg'
    uses: AIntegrator/github-workflows/.github/workflows/notify-google-chat.yml@main
    with:
      label: ${{ github.event.label.name }}
    secrets: inherit